    <!--
      Splash screen: pure HTML/CSS/JS, with no dependency on the React
      bundle, so it paints the instant the browser has this HTML — no blank
      white flash while the app's JS downloads and boots, even on a slow
      connection. It's removed by the inline script below, always at least
      ~1s after the page starts loading, with a smooth fade-out. The actual
      app underneath mounts and starts fetching data immediately in
      parallel — this overlay never delays anything, it just covers the
      brief gap so the first thing anyone sees is the brand, not a blank
      page or a layout jumping into place.
    -->
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at center, #16214f 0%, #0f1d45 65%, #0b1636 100%);
        overflow: hidden;
        font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
        transition: opacity 0.45s ease-in, visibility 0.45s ease-in;
      }
      #app-splash.splash-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #app-splash .splash-grid {
        position: absolute;
        inset: 0;
        opacity: 0.35;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        background-size: 34px 34px;
      }
      #app-splash .splash-glow {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 480px;
        height: 480px;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(249, 115, 22, 0.16) 0%, rgba(249, 115, 22, 0) 70%);
        filter: blur(4px);
      }
      #app-splash .splash-content {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0 24px;
        text-align: center;
      }
      #app-splash .splash-ring-wrap {
        position: relative;
        width: 92px;
        height: 92px;
        margin-bottom: 22px;
      }
      #app-splash .splash-ring-track {
        position: absolute;
        inset: 0;
        border-radius: 9999px;
        border: 2px solid rgba(255, 255, 255, 0.1);
      }
      #app-splash .splash-ring-spin {
        position: absolute;
        inset: 0;
        border-radius: 9999px;
        border: 2px solid transparent;
        border-top-color: #f97316;
        border-right-color: rgba(249, 115, 22, 0.35);
        animation: splash-spin 1.15s linear infinite;
      }
      #app-splash .splash-mark {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 21px;
        font-weight: 800;
        color: #ffffff;
        animation: splash-pop-in 0.65s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      #app-splash .splash-mark span {
        color: #f97316;
      }
      #app-splash h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.01em;
        color: #ffffff;
        animation: splash-pop-in 0.65s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      #app-splash h1 span {
        color: #f97316;
      }
      #app-splash p {
        margin: 8px 0 0;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #a9b6dd;
        animation: splash-fade-up 0.6s ease-out 0.3s both;
      }
      #app-splash .splash-dots {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-top: 26px;
      }
      #app-splash .splash-dots i {
        width: 7px;
        height: 7px;
        border-radius: 9999px;
        background: #f97316;
        display: inline-block;
        animation: splash-pulse 1.1s ease-in-out infinite;
      }
      #app-splash .splash-dots i:nth-child(2) { animation-delay: 0.15s; }
      #app-splash .splash-dots i:nth-child(3) { animation-delay: 0.3s; }

      @media (max-width: 480px) {
        #app-splash h1 { font-size: 16px; }
        #app-splash .splash-ring-wrap { width: 78px; height: 78px; }
        #app-splash .splash-mark { font-size: 18px; }
      }

      @keyframes splash-spin { to { transform: rotate(360deg); } }
      @keyframes splash-pop-in { from { opacity: 0; transform: scale(0.82) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
      @keyframes splash-fade-up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes splash-pulse { 0%, 100% { transform: scale(1); opacity: 0.45; } 50% { transform: scale(1.5); opacity: 1; } }

      @media (prefers-reduced-motion: reduce) {
        #app-splash * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" role="status" aria-label="Loading ASK IT Technologies">
      <div class="splash-grid"></div>
      <div class="splash-glow"></div>
      <div class="splash-content">
        <div class="splash-ring-wrap">
          <div class="splash-ring-track"></div>
          <div class="splash-ring-spin"></div>
          <div class="splash-mark">ASK<span>IT</span></div>
        </div>
        <h1>ASK IT <span>Technologies</span></h1>
        <p>Empowering Careers Through Skills</p>
        <div class="splash-dots"><i></i><i></i><i></i></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Always show the splash for at least ~1s, then fade it out. Uses the
      // navigation timing origin (not "script start") so slow connections
      // that took a while just to get this far don't get an extra-long
      // splash on top of that.
      (function () {
        var MIN_VISIBLE_MS = 1000;
        var startedAt = (window.performance && performance.timeOrigin) ? performance.timeOrigin : Date.now();
        var elapsed = Date.now() - startedAt;
        var remaining = Math.max(0, MIN_VISIBLE_MS - elapsed);

        function hideSplash() {
          var el = document.getElementById('app-splash');
          if (!el) return;
          el.classList.add('splash-hidden');
          setTimeout(function () { el.remove(); }, 500);
        }

        setTimeout(hideSplash, remaining);
      })();
    </script>
  </body>
